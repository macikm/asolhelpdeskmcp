services:
  asolhelpdeskmcp:
    build:
      context: .
      network: host
    image: asolhelpdeskmcp:latest
    container_name: asolhelpdeskmcp
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TZ=Europe/Prague
      - PORT=8095
      - HOST=0.0.0.0
      - API_URL=https://avaplace.com/api/asoleu/helpdesk
      - AUTH_URL=https://avaplace.com/api/asol/idp/connect/token
    env_file:
      - path: .env
        required: false
    networks:
      - infrastructure_default
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "app=asolhelpdeskmcp"
      - "maintainer=macikm"

networks:
  infrastructure_default:
    external: true
